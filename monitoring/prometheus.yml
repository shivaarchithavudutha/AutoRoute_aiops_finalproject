global:
  scrape_interval: 5s          # fast, so Grafana looks "near real time"
  evaluation_interval: 5s
rule_files:
  - /etc/prometheus/alert_rules.yml
scrape_configs:
  - job_name: gateway
    static_configs: [{targets: ["gateway:8000"]}]
  - job_name: trainer
    static_configs: [{targets: ["trainer:8100"]}]
  - job_name: prometheus
    static_configs: [{targets: ["localhost:9090"]}]
